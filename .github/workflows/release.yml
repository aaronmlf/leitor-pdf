name: Release desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release (por exemplo, v1.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            suffix: exe
          - os: ubuntu-22.04
            bundle: deb
            suffix: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run typecheck
      - run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.bundle }}
          path: apps/desktop/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.suffix }}
          if-no-files-found: error

  attach:
    runs-on: ubuntu-latest
    needs: desktop
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Anexar os instaladores à release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.deb)
          test "${#files[@]}" -eq 2
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Leitor ${RELEASE_TAG#v}" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
